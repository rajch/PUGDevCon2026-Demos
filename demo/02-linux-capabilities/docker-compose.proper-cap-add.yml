services:
  postgres:
    image: postgres:16-alpine
    container_name: paydesk-postgres-s2
    restart: unless-stopped
    environment:
      POSTGRES_USER: paydesk
      POSTGRES_PASSWORD: paydesk_secret_password
      POSTGRES_DB: paydesk_db
    ports:
      - "5432:5432"

  paydesk-web:
    image: paydesk:latest
    container_name: paydesk-web-s2-proper
    depends_on:
      - postgres
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=paydesk_db;Username=paydesk;Password=paydesk_secret_password"
      Storage__DataDirectory: "/app/data"
    ports:
      - "8080:8080"
    # PROPER FIX: Drop ALL capabilities by default, and selectively restore ONLY NET_RAW!
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
