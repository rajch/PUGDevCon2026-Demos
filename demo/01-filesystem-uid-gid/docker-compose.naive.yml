services:
  postgres:
    image: postgres:16-alpine
    container_name: paydesk-postgres-s1
    restart: unless-stopped
    environment:
      POSTGRES_USER: paydesk
      POSTGRES_PASSWORD: paydesk_secret_password
      POSTGRES_DB: paydesk_db
    ports:
      - "5432:5432"

  paydesk-web:
    image: paydesk:latest
    container_name: paydesk-web-s1-naive
    depends_on:
      - postgres
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=paydesk_db;Username=paydesk;Password=paydesk_secret_password"
      Storage__DataDirectory: "/app/data"
    ports:
      - "8080:8080"
    volumes:
      # Naive volume mount: Host directory mounted to /app/data
      # Since the container runs as non-root 'app' (UID 1654),
      # and the host folder is owned by root/different user, uploads fail!
      - ./naive-host-data:/app/data
