services:
  postgres:
    image: postgres:16-alpine
    container_name: paydesk-postgres-s1
    restart: unless-stopped
    environment:
      POSTGRES_USER: paydesk
      POSTGRES_PASSWORD: paydesk_secret_password
      POSTGRES_DB: paydesk_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paydesk -d paydesk_db"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Init container sets the volume ownership to UID 1654:1654 before app starts
  volume-init:
    image: alpine:latest
    container_name: paydesk-vol-init
    command: ["chown", "-R", "1654:1654", "/app/data"]
    volumes:
      - ./proper-host-data:/app/data

  paydesk-web:
    image: paydesk:latest
    container_name: paydesk-web-s1-proper
    depends_on:
      volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=paydesk_db;Username=paydesk;Password=paydesk_secret_password"
      Storage__DataDirectory: "/app/data"
    ports:
      - "8080:8080"
    volumes:
      - ./proper-host-data:/app/data
