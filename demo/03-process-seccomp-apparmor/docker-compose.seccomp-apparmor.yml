services:
  postgres:
    image: postgres:16-alpine
    container_name: paydesk-postgres-s3
    restart: unless-stopped
    environment:
      POSTGRES_USER: paydesk
      POSTGRES_PASSWORD: paydesk_secret_password
      POSTGRES_DB: paydesk_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paydesk -d paydesk_db"]
      interval: 2s
      timeout: 3s
      retries: 15

  paydesk-web:
    image: paydesk:latest
    container_name: paydesk-web-s3-runtime
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=paydesk_db;Username=paydesk;Password=paydesk_secret_password"
      Storage__DataDirectory: "/app/data"
    ports:
      - "8080:8080"
    # Process and security options:
    # 1. no-new-privileges: Prevents child processes from acquiring additional privileges (setuid)
    # 2. Applies seccomp profile filtering
    security_opt:
      - no-new-privileges:true
      - seccomp:./seccomp-profile.json
