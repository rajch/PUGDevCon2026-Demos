volumes:
  postgres_vol:

  paydesk_vol:

services:
  postgres:
    image: postgres:16-alpine
    container_name: d2-2-paydesk-postgres
    volumes:
      - postgres_vol:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: paydesk
      POSTGRES_PASSWORD: paydesk_secret_password
      POSTGRES_DB: paydesk_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paydesk -d paydesk_db"]
      interval: 2s
      timeout: 3s
      retries: 15

  paydesk-web:
    image: paydesk:0.1.0-beta2
    build:
      context: ..
      dockerfile: package/paydesk-0.1.0-beta2.dockerfile
    container_name: d2-2-paydesk-web
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=paydesk_db;Username=paydesk;Password=paydesk_secret_password"
      Storage__DataDirectory: "/app/data"
    ports:
      - "8080:8080"
    volumes:
      # Volume mounted to /app/data
      # Since the container runs as non-root 'app' (UID 1654),
      # that user needs to have write permissions on the volume.
      # If not, uploads fail!
      - type: volume
        source: paydesk_vol
        target: /app/data
    # HARDENED CONTAINER: Dropping ALL Linux capabilities (recommended by CIS Benchmarks)
    # Effect: Standard TCP works, but ICMP Ping fails on the /Status page with 'Operation not permitted'!
    # cap_drop:
    #   - ALL
    # ANTI-PATTERN: Giving the container full 'privileged' mode just to make ping work!
    # Disables seccomp, AppArmor, exposes all host devices, and grants all capabilities.
    privileged: true